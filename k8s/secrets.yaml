# secrets.yaml - PLACEHOLDER TEMPLATE
# IMPORTANT: Never commit real secrets to source control.
# Replace <BASE64_ENCODED_VALUE> with actual base64-encoded values.
# Generate: echo -n 'my-secret' | base64
# Apply with: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: iosct-secrets
  namespace: iosct
  labels:
    app.kubernetes.io/part-of: internet-of-space-things
type: Opaque
data:
  # echo -n 'change-me-strong-password' | base64
  POSTGRES_PASSWORD: <BASE64_ENCODED_POSTGRES_PASSWORD>
  # echo -n 'change-me-influxdb-token' | base64
  INFLUXDB_TOKEN: <BASE64_ENCODED_INFLUXDB_TOKEN>
  # echo -n 'change-me-admin-token' | base64
  INFLUXDB_ADMIN_TOKEN: <BASE64_ENCODED_INFLUXDB_ADMIN_TOKEN>
  # echo -n 'change-me-dashboard-secret' | base64
  DASHBOARD_SECRET_KEY: <BASE64_ENCODED_DASHBOARD_SECRET>
