# mission-control.yaml - Mission Control API + Web Dashboard Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: iosct
  labels:
    app: mission-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission-control
  template:
    metadata:
      labels:
        app: mission-control
    spec:
      containers:
        - name: mission-control
          image: iosct/mission-control:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iosct-config
            - secretRef:
                name: iosct-secrets
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control-svc
  namespace: iosct
  labels:
    app: mission-control
spec:
  selector:
    app: mission-control
  ports:
    - name: http
      port: 80
      targetPort: 5000
