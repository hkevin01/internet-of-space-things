# telemetry-processor.yaml - Kafka Consumer + InfluxDB/PostgreSQL Writer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-processor
  namespace: iosct
  labels:
    app: telemetry-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-processor
  template:
    metadata:
      labels:
        app: telemetry-processor
    spec:
      containers:
        - name: telemetry-processor
          image: iosct/telemetry-processor:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: iosct-config
            - secretRef:
                name: iosct-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: telemetry-processor-hpa
  namespace: iosct
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: telemetry-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
